name: "Publish"

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # base images pinned by digest so a mutated :latest cannot change what
        # CI builds without a repository change; bump digests deliberately
        include:
          - arch: amd64
            os: ubuntu-24.04
            base: ghcr.io/home-assistant/amd64-base:latest@sha256:2b60b12b34ccd960fda082d223b40dbb2b0bb40af95f12912233b736f27fc47a
          - arch: aarch64
            os: ubuntu-24.04-arm
            base: ghcr.io/home-assistant/aarch64-base:latest@sha256:2ac8f73090063ac23e63a1adc144bd1d8aa88f5e5d92c68898102e81046084a4
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Read add-on version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(grep -m1 '^version:' config.yaml | sed -E 's/^version:[[:space:]]*//')
          tag="${RELEASE_TAG:-$REF_NAME}"
          if [[ -z "$RELEASE_TAG" && "$REF_TYPE" != "tag" ]]; then
            echo "Manual publishing must run from a release tag." >&2
            exit 1
          fi
          if [[ "$tag" != "$version" ]]; then
            echo "Release tag $tag does not match config.yaml version $version." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          image: ghcr.io/knowald/addon-ha-hearth-${{ matrix.arch }}
          version: ${{ steps.version.outputs.version }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          container-registry: ghcr.io
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tags: |
            ${{ steps.version.outputs.version }}
            latest
          push: "true"
          cosign: "false"
